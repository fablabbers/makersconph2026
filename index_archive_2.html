
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>MakersCon PH 2026</title>
	<link rel="icon" type="image/x-icon" href="/images/logo_favicon.png">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
	<script src="js/gsap.min.js"></script>
    <link href="https://iosevka-webfonts.github.io/iosevka/iosevka.css" rel="stylesheet" />
	<style>
		:root{
			--dark:#585556;
			--accent:#FF853C;
			--blue:#4A90E0;
			--bg:#ffffff;
		}
		html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
		body{background:var(--bg);color:var(--dark);overflow:hidden}
		#sketch-holder{position:fixed;inset:0;z-index:0}
		header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:28px 48px}
		.nav{display:flex;gap:28px;align-items:center;font-family:'Iosevka Web';font-weight:600}
		.nav a{text-decoration:none;letter-spacing:0.06em}
		.cta{background:var(--accent);color:white;padding:10px 16px;border-radius:4px;font-weight:700;text-decoration:none}
		.title-wrap{position:relative;z-index:2;display:flex;flex-direction:column;padding:120px 48px}
		h1{margin:0;font-size:64px;color:var(--dark);letter-spacing:-1px}
        h2{font-family:'Inter';font-weight:600;margin:0;color:var(--dark);letter-spacing:0.1em}
		.subtitle{margin-top:12px;color:var(--accent);font-weight:700}
        .label{font-family:'Iosevka Web';margin-top:8px;color:var(--dark);font-weight:500;font-size:18px}
		/* small screens */
		@media(max-width:700px){h1{font-size:36px;padding:0 24px}.title-wrap{padding-top:80px}}
	</style>
    
</head>
<body>
	<div id="sketch-holder"></div>
	<div id="overlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
		<div class="bg-white rounded-lg p-8 text-center shadow-2xl relative">
			<button id="close-btn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold">×</button>
			<h2 class="text-3xl font-bold mb-2">In Progress🔧🔨</h2>
			<p class="text-gray-600">We're updating the website, check back soon!</p>
			<p class="text-gray-600">For urgent matters, please contact us at makersconph2026@gmail.com</p>
		</div>
	</div>
	<header class="justify-end">
		<nav class="rounded-lg border drop-shadow-md shadow-lg overflow-hidden p-4 bg-white border-stone-200 shadow-stone-950/5 sticky top-0 mx-end max-w-screen-xl nav flex-col gap-1 items-center font-['Iosevka Web'] font-semibold">
			<a href="#about">ABOUT</a>
			<a href="#speakers">SPEAKERS</a>
			<a href="#activities">ACTIVITIES</a>
			<a class="cta" target="_blank" href="https://docs.google.com/forms/d/e/1FAIpQLSfLo1CWALC96mhffbVrqGYagR19cmzzNkr_xNnmlQCwyYDr5w/viewform">REGISTER</a>
		</nav>
	</header>

	<main class="title-wrap justify-end">
        <object class="min-w-80 w-1/2" data="images/logo_hero.svg" type="image/svg+xml" class="select-none"></object>
		<h2 class="subtitle text-xl">Sharing Knowledge, Sharing Futures</h2>
        <p class="label">November 12-13, 2026 • UP Diliman College of Fine Arts</p>
	</main>

	<script>
		// GSAP entrance animations
		window.addEventListener('load', ()=>{
			gsap.from('header', {y:-40, opacity:0, duration:0.8, ease:'power2.out'});
			gsap.from('.title-wrap', {y:40, opacity:0, duration:0.9, delay:0.15, ease:'power2.out'});
			gsap.from('.nav a', {y:-8, opacity:0, duration:0.6, stagger:0.06, delay:0.25});
		});

		// GSAP hover animations
		document.querySelectorAll('.nav a').forEach(link => {
			link.addEventListener('mouseenter', () => {
				gsap.to(link, {scale:1.05, duration:0.3, ease:'power2.out'});
			});
			link.addEventListener('mouseleave', () => {
				gsap.to(link, {scale:1, duration:0.3, ease:'power2.out'});
			});
		});
	</script>
    <script src="js/grid.js"></script>

	<script>
		// close overlay on click
		document.getElementById('close-btn').addEventListener('click', function(){
			var ov = document.getElementById('overlay');
			if(ov) ov.style.display = 'none';
		});
	</script>

</body>
</html>
